[workspace]
# Per-book workspace outside this repository. Replace <windows-user> before use.
root = "/mnt/c/Users/<windows-user>/Audiobooks"

# Private source, gold labels, model runs, and reports use <workspace.root>/evaluation/.
# They must remain outside this repository.

[review]
listen_url = "http://127.0.0.1:3000"
browser_url = "http://localhost:3000"

[local_security]
allowed_review_hosts = ["localhost:3000", "127.0.0.1:3000"]
allowed_review_origins = ["http://localhost:3000", "http://127.0.0.1:3000"]
require_csrf_for_state_changes = true
allow_browser_origins_on_model_endpoints = false

[brain]
base_url = "http://127.0.0.1:8080/v1"
model = ""
context_size = 32768
temperature = 0.0

[tts]
base_url = "http://127.0.0.1:8081"
model = "voxcpm"
seed = 42
cfg_value = 2.0
inference_timesteps = 10

[quality_control]
minimum_speaker_confidence = 0.80
transcription_check = false

[audio]
sample_rate = 48000
chapter_format = "flac"
final_format = "m4b"
