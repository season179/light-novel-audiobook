[workspace]
# Per-book workspace outside this repository.
root = "/mnt/c/Users/WINDOWS 11/Audiobooks"

# Private source, gold labels, model runs, and reports use <workspace.root>/evaluation/.
# They must remain outside this repository.

[brain]
base_url = "https://brain.audiobook.localhost/v1"
model = ""
context_size = 32768
temperature = 0.0

[tts]
base_url = "https://tts.audiobook.localhost"
model = "voxcpm"
seed = 42
cfg_value = 2.0
inference_timesteps = 10

[quality_control]
minimum_speaker_confidence = 0.80
transcription_check = false

[audio]
sample_rate = 48000
chapter_format = "flac"
final_format = "m4b"
