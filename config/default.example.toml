[workspace]
# Per-book workspace outside this repository. Replace <windows-user> before use.
root = "/mnt/c/Users/<windows-user>/Audiobooks"

# Private source, gold labels, model runs, and reports use <workspace.root>/evaluation/.
# They must remain outside this repository.

[review]
listen_url = "http://127.0.0.1:3000"
browser_url = "http://localhost:3000"

[local_security]
allowed_review_hosts = ["localhost:3000", "127.0.0.1:3000"]
allowed_review_origins = ["http://localhost:3000", "http://127.0.0.1:3000"]
require_csrf_for_state_changes = true
allow_browser_origins_on_model_endpoints = false

[brain]
base_url = "http://127.0.0.1:8080/v1"
profile = "google-gemma-4-26b-a4b-it-qat-q4-0"
model = "google-gemma-4-26b-a4b-it-qat-q4-0"
# WSL ext4 runtime path; replace <wsl-user> or configure the launcher environment.
model_path = "/home/<wsl-user>/.cache/light-novel-audiobook/issue-6-brain/models/gemma-4-26B_q4_0-it.gguf"
context_size = 32768
temperature = 0.0
seed = 42
top_p = 1.0

[gpu]
# One stable kernel-flock path shared by Gemma, Qwen, and the final composition root.
lease_path = "/home/<wsl-user>/.local/state/light-novel-audiobook/gpu/exclusive.lock"

[gpu]
# One stable kernel-flock path shared by Gemma, Qwen, and the final composition root.
lease_path = "/home/<wsl-user>/.local/state/light-novel-audiobook/gpu/exclusive.lock"

[tts]
# Reserved loopback endpoint for any later accepted server; this batch adapter does not listen.
base_url = "http://127.0.0.1:8081"
adapter = "qwen3-tts-python-batch"
# Keep runtime/model/output paths on WSL ext4 and outside this Git worktree.
runtime_root = "/home/<wsl-user>/.local/share/light-novel-audiobook/runtimes/tts/qwen3-tts/<uv-lock-sha>"
model_snapshot = "/home/<wsl-user>/.local/share/light-novel-audiobook/models/tts/qwen3-tts-custom-voice/0c0e3051f131929182e2c023b9537f8b1c68adfe/snapshot"
output_root = "/home/<wsl-user>/.local/state/light-novel-audiobook/rendered-segments"
fallback_voice_profile = "ryan-low-weary"

[quality_control]
minimum_speaker_confidence = 0.80
transcription_check = false

[audio]
sample_rate = 48000
chapter_format = "flac"
final_format = "m4b"
