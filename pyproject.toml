[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "light-novel-audiobook"
version = "0.1.0"
description = "Local multi-voice EPUB-to-audiobook pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Project contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
