name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Node 24 validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FFMPEG_ARCHIVE_SHA256: abda8d77ce8309141f83ab8edf0596834087c52467f6badf376a6a2a4c87cf67
      FFMPEG_ARCHIVE_URL: https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Host evidence names its implementation commit; CI recomputes that exact source set.
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false

      - name: Install pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Cache pinned FFmpeg archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/light-novel-audiobook/ffmpeg/ffmpeg-release-amd64-static.tar.xz
          key: ffmpeg-${{ runner.os }}-amd64-${{ env.FFMPEG_ARCHIVE_SHA256 }}

      - name: Install pinned FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          archive_directory="$HOME/.cache/light-novel-audiobook/ffmpeg"
          archive="$archive_directory/ffmpeg-release-amd64-static.tar.xz"
          download="$archive.download"
          install_directory="$HOME/.local/share/light-novel-audiobook/tools/ffmpeg/current"
          mkdir -p "$archive_directory"

          if [[ ! -f "$archive" ]]; then
            rm -f "$download"
            curl --fail --location --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 \
              "$FFMPEG_ARCHIVE_URL" --output "$download"
            mv "$download" "$archive"
          fi

          printf '%s  %s\n' "$FFMPEG_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          rm -rf "$install_directory"
          mkdir -p "$install_directory"
          tar -xJf "$archive" -C "$install_directory" --strip-components=1
          test -x "$install_directory/ffmpeg"
          test -x "$install_directory/ffprobe"

          ffmpeg_output="$("$install_directory/ffmpeg" -hide_banner -version)"
          ffprobe_output="$("$install_directory/ffprobe" -hide_banner -version)"
          ffmpeg_version="${ffmpeg_output%%$'\n'*}"
          ffprobe_version="${ffprobe_output%%$'\n'*}"
          printf '%s\n%s\n' "$ffmpeg_version" "$ffprobe_version"
          [[ "$ffmpeg_version" == "ffmpeg version 7.0.2"* ]]
          [[ "$ffprobe_version" == "ffprobe version 7.0.2"* ]]

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run formatting, linting, import, type, and test checks
        run: pnpm check

      - name: Build workspace
        run: pnpm build

  validate-macos:
    # Portable Apple Silicon install/toolchain gate for issue #108, pinned by
    # config/macos-ci-gate.json. It is not equivalent to the Linux/WSL2 `pnpm check` gate.
    # Excluded Linux-only contracts remain owned by #107/#111-#113: WSL2 installer validation,
    # flock, /proc identity, ext4/DrvFS and findmnt, Bash 4 process-tree assumptions, Linux
    # process-group/reaper semantics, and Python prctl parent-death signalling.
    name: Node 24 validation (macOS arm64)
    runs-on: macos-15-arm64
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Install pinned pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false

      - name: Install pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Build and install pinned FFmpeg/ffprobe 7.0.2 from source
        shell: bash
        run: bash scripts/build-ffmpeg-macos.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run native macOS toolchain preflight
        run: pnpm preflight

      - name: Run formatting, linting, and import checks
        run: pnpm exec biome check .

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Run portable macOS policy tests
        run: node --test scripts/test/preflight-toolchain.test.mjs scripts/test/ffmpeg-artifacts.test.mjs scripts/test/macos-ci-gate.test.mjs

      - name: Build workspace
        run: pnpm build

      - name: Probe installed FFmpeg/ffprobe 7.0.2 exactly
        shell: bash
        run: |
          install_directory="$HOME/.local/share/light-novel-audiobook/tools/ffmpeg/current"
          ffmpeg_output="$("$install_directory/ffmpeg" -hide_banner -version)"
          ffprobe_output="$("$install_directory/ffprobe" -hide_banner -version)"
          ffmpeg_version="${ffmpeg_output%%$'\n'*}"
          ffprobe_version="${ffprobe_output%%$'\n'*}"
          printf '%s\n%s\n' "$ffmpeg_version" "$ffprobe_version"
          [[ "$ffmpeg_version" == "ffmpeg version 7.0.2"* ]]
          [[ "$ffprobe_version" == "ffprobe version 7.0.2"* ]]
